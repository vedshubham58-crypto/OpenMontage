<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=2700" />
    <title>DrinksBite — SKU Posters</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geometr706 BlkCn"; src: url("assets/geometr.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Bernard MT Condensed"; src: url("assets/bernard.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Berlin Sans FB"; src: url("assets/berlin.ttf") format("truetype"); font-display: block; }
      html, body { margin: 0; padding: 0; background: #121212; }
      #root { position: relative; width: 2160px; height: 2700px; overflow: hidden; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .art { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform: scale(2); transform-origin: 0 0; overflow: hidden;
        background: radial-gradient(ellipse 80% 55% at 50% 60%, #1d1c1b 0%, #141414 55%, #0e0e0e 100%); color: #f5f0ea; text-transform: uppercase; }
      .abs { position: absolute; }
      .pat { position: absolute; inset: -60px; background-image: url("assets/pattern.png"); background-size: 300px 155px; opacity: 0.09; }
      .spot { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 30% at 50% 0%, rgba(245,240,234,0.09) 0%, rgba(245,240,234,0) 70%); }
      .c { left: 0; right: 0; text-align: center; }
      .lbl { font-family: "Berlin Sans FB", sans-serif; }
      .flav { font-family: "Bernard MT Condensed", serif; line-height: 1; letter-spacing: 1px; }
      .disp { font-family: "Geometr706 BlkCn", sans-serif; line-height: 0.95; }
      .glow { position: absolute; border-radius: 50%; }
      .refl { position: absolute; top: 1006px; left: 0; width: 1080px; height: 110px; overflow: hidden;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 85%); mask-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 85%); }
      .refl img { position: absolute; top: 0; transform: scaleY(-1); transform-origin: 50% 0; }
      .pk { position: absolute; filter: drop-shadow(0 18px 22px rgba(0,0,0,0.55)); }
      .grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); background-size: 256px 256px; opacity: 0.055; mix-blend-mode: overlay; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="2160" data-height="2700" data-duration="3" data-fps="30"></div>
    <script>
      const SKU = [
        { n: "beer", name: "Cheddar &amp; Herbs", fs: 116, drink: "Beer", c: "#f7b733", cl: "#f7b733", glow: "rgba(247,183,51,0.20)", gi: [49, 96],
          notes: [["Bright,", "tangy crunch"], ["Savory garlic", "&amp; herbs"], ["Low-key", "malty depth"]] },
        { n: "whiskey", name: "Toasted Sesame Umami", fs: 96, drink: "Whiskey", c: "#8a5baa", cl: "#b48fd0", glow: "rgba(138,91,170,0.26)", gi: [84, 96],
          notes: [["Deep roasted", "flavour"], ["Pure", "umami"], ["Toasted-oak", "warmth"]] },
        { n: "rum", name: "Coconut &amp; Spices", fs: 116, drink: "Rum", c: "#669933", cl: "#8cc152", glow: "rgba(102,153,51,0.26)", gi: [73, 96],
          notes: [["Soft", "sweetness"], ["Warm spice &amp;", "subtle smoke"], ["Zesty", "citrus pop"]] },
      ];
      const root = document.getElementById("root");
      SKU.forEach((s, i) => {
        const PW = 360, PH = Math.round(PW * 1.825), FLOOR = 1004, PX = 540 - PW / 2, PY = FLOOR - PH;
        // callouts: two on the left, one on the right, vertically balanced around the pack
        const call = (txt, side, y) => side === "L"
          ? `<div class="abs lbl" style="left:70px;width:250px;top:${y}px;text-align:right;font-size:18px;letter-spacing:3px;line-height:1.35;color:rgba(245,240,234,0.9)">${txt[0]}<br/>${txt[1]}<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.c};margin-left:14px;vertical-align:2px"></span></div>`
          : `<div class="abs lbl" style="left:760px;width:250px;top:${y}px;text-align:left;font-size:18px;letter-spacing:3px;line-height:1.35;color:rgba(245,240,234,0.9)"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.c};margin-right:14px;vertical-align:2px"></span>${txt[0]}<br/><span style="margin-left:23px">${txt[1]}</span></div>`;
        const sec = document.createElement("section");
        sec.className = "clip"; sec.style.zIndex = String(i + 1);
        sec.setAttribute("data-start", String(i)); sec.setAttribute("data-duration", "1"); sec.setAttribute("data-track-index", String(i + 1));
        sec.innerHTML = `<div class="art">
          <div class="pat"></div><div class="spot"></div>
          <img class="abs" src="assets/logo-h.png" alt="DrinksBite" style="left:50%;top:58px;width:210px;margin-left:-100px"/>
          <div class="abs c lbl" style="top:146px;font-size:14px;letter-spacing:9px;color:rgba(245,240,234,0.6)">India's first drink-pairing chakna</div>
          <div class="abs c flav" style="top:${262 - s.fs * 0.62}px;font-size:${s.fs}px;color:${s.cl}">${s.name}</div>
          <div class="glow" style="left:190px;top:330px;width:700px;height:760px;background:radial-gradient(ellipse at 50% 55%, ${s.glow} 0%, rgba(0,0,0,0) 64%)"></div>
          <div class="abs" style="left:150px;right:150px;top:${FLOOR}px;height:2px;background:linear-gradient(90deg, rgba(245,240,234,0) 0%, rgba(245,240,234,0.35) 20%, rgba(245,240,234,0.35) 80%, rgba(245,240,234,0) 100%)"></div>
          <div class="abs" style="left:${PX - 30}px;top:${FLOOR - 22}px;width:${PW + 60}px;height:44px;border-radius:50%;background:radial-gradient(ellipse, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 70%)"></div>
          <div class="refl"><img src="assets/pack-${s.n}-tight.png" style="left:${PX}px;width:${PW}px;height:${PH}px" alt=""/></div>
          <img class="pk" src="assets/pack-${s.n}-tight.png" alt="" style="left:${PX}px;top:${PY}px;width:${PW}px;height:${PH}px"/>
          ${call(s.notes[0], "L", 470)}${call(s.notes[1], "R", 640)}${call(s.notes[2], "L", 810)}
          <div class="abs c lbl" style="top:1046px;font-size:16px;letter-spacing:8px;color:rgba(245,240,234,0.7)">Best paired with</div>
          <div class="abs" style="left:0;right:0;top:1078px;display:flex;justify-content:center;align-items:center;gap:22px">
            <img src="assets/la-glass-${s.n}.png" alt="" style="width:${s.gi[0]}px;height:${s.gi[1]}px"/>
            <span class="disp" style="font-size:108px;letter-spacing:3px;color:#f5f0ea;line-height:1;padding-top:8px">${s.drink}</span>
          </div>
          <div class="abs c lbl" style="top:1240px;font-size:18px;letter-spacing:12px">Pair <span style="color:#f7b733">·</span> Sip <span style="color:#b48fd0">·</span> Repeat</div>
          <div class="abs c lbl" style="top:1278px;font-size:12px;letter-spacing:4px;color:rgba(245,240,234,0.5);text-transform:none">@drinksbite_official &nbsp;·&nbsp; drinksbite.com</div>
          <div class="vig"></div><div class="grain"></div></div>`;
        root.appendChild(sec);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
