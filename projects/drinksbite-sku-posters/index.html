<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=2700" />
    <title>DrinksBite — SKU Posters</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geometr706 BlkCn"; src: url("assets/geometr.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Bernard MT Condensed"; src: url("assets/bernard.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Berlin Sans FB"; src: url("assets/berlin.ttf") format("truetype"); font-display: block; }
      html, body { margin: 0; padding: 0; background: #121212; }
      #root { position: relative; width: 2160px; height: 2700px; overflow: hidden; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .art { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform: scale(2); transform-origin: 0 0; overflow: hidden;
        background: radial-gradient(ellipse 80% 55% at 50% 60%, #1d1c1b 0%, #141414 55%, #0e0e0e 100%); color: #f5f0ea; text-transform: uppercase; }
      .abs { position: absolute; }
      .pat { position: absolute; inset: -60px; background-image: url("assets/pattern.png"); background-size: 300px 155px; opacity: 0.09; }
      .spot { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 30% at 50% 0%, rgba(245,240,234,0.09) 0%, rgba(245,240,234,0) 70%); }
      .c { left: 0; right: 0; text-align: center; }
      .lbl { font-family: "Berlin Sans FB", sans-serif; }
      .flav { font-family: "Bernard MT Condensed", serif; line-height: 1; letter-spacing: 1px; }
      .disp { font-family: "Geometr706 BlkCn", sans-serif; line-height: 0.95; }
      .glow { position: absolute; border-radius: 50%; }
      .refl { position: absolute; top: 1012px; left: 0; width: 1080px; height: 110px; overflow: hidden;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 85%); mask-image: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 85%); }
      .refl img { position: absolute; top: 0; transform: scaleY(-1); transform-origin: 50% 0; }
      .pk { position: absolute; filter: drop-shadow(0 18px 22px rgba(0,0,0,0.55)); }
      .grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); background-size: 256px 256px; opacity: 0.055; mix-blend-mode: overlay; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="2160" data-height="2700" data-duration="3" data-fps="30"></div>
    <script>
      const SKU = [
        { n: "beer", name: "Cheddar &amp; Herbs", fs: 108, drink: "Beer", c: "#f7b733", cl: "#f7b733", glow: "rgba(247,183,51,0.16)",
          notes: "Bright, tangy crunch · Savory garlic &amp; herbs · Malty depth", glass: [270, 528] },
        { n: "whiskey", name: "Toasted Sesame Umami", fs: 92, drink: "Whiskey", c: "#8a5baa", cl: "#b48fd0", glow: "rgba(138,91,170,0.22)",
          notes: "Deep roasted flavour · Pure umami · Toasted-oak warmth", glass: [270, 310] },
        { n: "rum", name: "Coconut &amp; Spices", fs: 108, drink: "Rum", c: "#669933", cl: "#8cc152", glow: "rgba(102,153,51,0.22)",
          notes: "Soft sweetness · Warm spice · Zesty citrus pop", glass: [272, 357] },
      ];
      const root = document.getElementById("root");
      SKU.forEach((s, i) => {
        const PW = 330, PH = Math.round(PW * 1.825), FLOOR = 1010, GAP = 26;
        const [gw, gh] = s.glass, total = gw + GAP + PW, x0 = (1080 - total) / 2;
        const gx = x0, px = x0 + gw + GAP;
        const sec = document.createElement("section");
        sec.className = "clip"; sec.style.zIndex = String(i + 1);
        sec.setAttribute("data-start", String(i)); sec.setAttribute("data-duration", "1"); sec.setAttribute("data-track-index", String(i + 1));
        sec.innerHTML = `<div class="art">
          <div class="pat"></div><div class="spot"></div>
          <img class="abs" src="assets/logo-h.png" alt="DrinksBite" style="left:50%;top:62px;width:230px;margin-left:-110px"/>
          <div class="abs c lbl" style="top:160px;font-size:15px;letter-spacing:8px;color:rgba(245,240,234,0.6)">India's first drink-pairing chakna</div>
          <div class="abs c flav" style="top:206px;font-size:${s.fs}px;color:${s.cl}">${s.name}</div>
          <div class="abs c lbl" style="top:${206 + s.fs + 22}px;font-size:15px;letter-spacing:4px;color:rgba(245,240,234,0.78)">${s.notes}</div>
          <div class="glow" style="left:140px;top:380px;width:800px;height:720px;background:radial-gradient(ellipse at 50% 60%, ${s.glow} 0%, rgba(0,0,0,0) 65%)"></div>
          <div class="abs" style="left:110px;right:110px;top:${FLOOR}px;height:2px;background:linear-gradient(90deg, rgba(245,240,234,0) 0%, rgba(245,240,234,0.38) 15%, rgba(245,240,234,0.38) 85%, rgba(245,240,234,0) 100%)"></div>
          <div class="abs" style="left:0;right:0;top:${FLOOR + 1}px;height:339px;background:linear-gradient(180deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0) 40%)"></div>
          <div class="refl"><img src="assets/la-glass-${s.n}.png" style="left:${gx}px;width:${gw}px;height:${gh}px" alt=""/><img src="assets/pack-${s.n}-tight.png" style="left:${px}px;width:${PW}px;height:${PH}px" alt=""/></div>
          <img class="abs" src="assets/la-glass-${s.n}.png" alt="" style="left:${gx}px;top:${FLOOR - gh}px;width:${gw}px;height:${gh}px"/>
          <img class="pk" src="assets/pack-${s.n}-tight.png" alt="" style="left:${px}px;top:${FLOOR - PH}px;width:${PW}px;height:${PH}px"/>
          <div class="abs c lbl" style="top:1056px;font-size:17px;letter-spacing:7px;color:rgba(245,240,234,0.72)">Best paired with</div>
          <div class="abs c disp" style="top:1082px;font-size:104px;color:#f5f0ea;letter-spacing:2px">${s.drink}</div>
          <div class="abs lbl" style="left:64px;top:1268px;font-size:13px;letter-spacing:3px;color:rgba(245,240,234,0.55);text-transform:none">@drinksbite_official</div>
          <div class="abs c lbl" style="top:1264px;font-size:20px;letter-spacing:10px">Pair <span style="color:#f7b733">·</span> Sip <span style="color:#b48fd0">·</span> Repeat</div>
          <div class="abs lbl" style="right:64px;top:1268px;font-size:13px;letter-spacing:3px;color:rgba(245,240,234,0.55)">drinksbite.com</div>
          <div class="abs c lbl" style="top:1302px;font-size:11px;letter-spacing:6px;color:rgba(245,240,234,0.4)">Not fried · Not baked · It's popped · Made with jowar</div>
          <div class="vig"></div><div class="grain"></div></div>`;
        root.appendChild(sec);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
