<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DrinksBite — Full Circle</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geometr706 BlkCn"; src: url("assets/geometr.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Aprilio Hope"; src: url("assets/aprilio.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Bernard MT Condensed"; src: url("assets/bernard.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Berlin Sans FB"; src: url("assets/berlin.ttf") format("truetype"); font-display: block; }
      :root {
        --ink: #171717; --deep: #0e0e0e; --cream: #f5f0ea; --mustard: #f7b733; --green: #669933; --purple: #8a5baa;
        --purple-lt: #b48fd0; --green-lt: #8cc152;
        --display: "Geometr706 BlkCn", "Arial Narrow", sans-serif; --label: "Berlin Sans FB", sans-serif;
        --flavour: "Bernard MT Condensed", serif; --body: "Aprilio Hope", sans-serif;
      }
      html, body { margin: 0; padding: 0; background: var(--deep); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--cream); }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .fill { position: absolute; inset: 0; }
      .abs { position: absolute; display: block; }
      .mask { display: block; overflow: hidden; }
      .ln { display: block; }

      /* hook */
      .disc { position: absolute; left: 230px; top: 650px; width: 620px; height: 620px; display: block; }
      #hook-word { position: absolute; left: 0; right: 0; top: 330px; height: 200px; text-align: center; }
      .hw { position: absolute; left: 0; right: 0; top: 0; font-family: var(--display); font-size: 190px; line-height: 1; text-transform: uppercase; opacity: 0; }
      #hook-line { position: absolute; left: 0; right: 0; top: 1390px; text-align: center; font-family: var(--display); font-size: 120px; line-height: 1; text-transform: uppercase; opacity: 0; }

      /* studio stage */
      .spot { position: absolute; inset: 0; opacity: 0; }
      #floor { position: absolute; left: 0; right: 0; top: 1360px; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,0.035) 0%, rgba(0,0,0,0) 60%); }
      .unit { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .pk { position: absolute; left: 280px; top: 640px; width: 520px; height: auto; display: block; }
      .shadow { position: absolute; left: 300px; top: 1336px; width: 480px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 70%); }
      .lp { position: absolute; display: block; }
      .lp-sh { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 70%); }
      .eyebrow { position: absolute; left: 90px; top: 230px; font-family: var(--label); font-size: 32px; letter-spacing: 10px; text-transform: uppercase; }
      .head { position: absolute; left: 90px; top: 280px; font-family: var(--display); font-size: 150px; line-height: 0.9; text-transform: uppercase; }
      .fname { position: absolute; left: 90px; top: 1450px; font-family: var(--flavour); font-size: 66px; line-height: 1; text-transform: uppercase; }
      .fsub { position: absolute; left: 90px; top: 1530px; font-family: var(--label); font-size: 28px; letter-spacing: 8px; text-transform: uppercase; color: rgba(245,240,234,0.6); }
      .idx { position: absolute; right: 90px; top: 1450px; font-family: var(--display); font-size: 66px; line-height: 1; color: rgba(245,240,234,0.22); }

      /* end slate */
      #sl-bg { background: radial-gradient(ellipse 70% 40% at 50% 8%, rgba(245,240,234,0.08) 0%, rgba(245,240,234,0) 70%), var(--ink); }
      #sl-pat { position: absolute; inset: -100px; background-image: url("assets/pattern.png"); background-size: 378px 195px; opacity: 0.2; }
      #sl-stage { position: absolute; inset: 0; }
      #sl-logo { position: absolute; left: 50%; top: 300px; width: 340px; height: 331px; margin-left: -170px; display: block; }
      #sl-rule { position: absolute; left: 470px; top: 700px; width: 140px; height: 3px; background: var(--mustard); }
      #sl-floor { position: absolute; left: 0; right: 0; top: 1420px; height: 500px; background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%); }
      #sl-row { position: absolute; left: 0; top: 0; width: 1080px; height: 1430px; overflow: hidden; }
      .sl-pk { position: absolute; display: block; height: auto; }
      .sl-sh { position: absolute; top: 1404px; height: 46px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%); }
      #sl-tag { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: var(--label); font-size: 40px; letter-spacing: 16px; text-transform: uppercase; }
      #sl-handle { position: absolute; left: 0; right: 0; top: 1570px; text-align: center; font-family: var(--label); font-size: 30px; letter-spacing: 4px; color: rgba(245,240,234,0.55); }
      #grain { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; background-image: url("assets/grain.png"); background-size: 512px 512px; opacity: 0.05; mix-blend-mode: overlay; }
      #vig { background: radial-gradient(ellipse 85% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="12" data-fps="30">

      <!-- HOOK 0–2.45: circles match-cut on the beat, eye locked at centre -->
      <section id="cH" class="clip" style="z-index: 1" data-start="0" data-duration="2.45" data-track-index="1">
        <div class="fill" style="background: var(--deep)"></div>
        <img class="disc" id="d0" src="assets/puff0.png" alt="" style="left: 410px; top: 830px; width: 260px; height: 260px" />
        <img class="disc" id="d1" src="assets/disc-beer.png" alt="" />
        <img class="disc" id="d2" src="assets/disc-whiskey.png" alt="" />
        <img class="disc" id="d3" src="assets/disc-rum.png" alt="" />
        <div id="hook-word">
          <div class="hw" id="w0">One</div><div class="hw" id="w1">Puff.</div>
          <div class="hw" id="w2" style="color: var(--mustard)">Three</div><div class="hw" id="w3" style="color: var(--mustard)">Moods.</div>
        </div>
        <div id="hook-line"><span style="color: var(--cream)">Which one</span> <span style="color: var(--mustard)">are you?</span></div>
      </section>

      <!-- STAGE 2.4–9.1: one continuous studio, packs travel right-to-left through centre -->
      <section id="cS" class="clip" style="z-index: 2" data-start="2.4" data-duration="6.7" data-track-index="2">
        <div class="fill" style="background: var(--deep)"></div>
        <div class="spot" id="sp1" style="background: radial-gradient(ellipse 55% 45% at 50% 30%, rgba(247,183,51,0.30) 0%, rgba(247,183,51,0) 70%)"></div>
        <div class="spot" id="sp2" style="background: radial-gradient(ellipse 55% 45% at 50% 30%, rgba(138,91,170,0.38) 0%, rgba(138,91,170,0) 70%)"></div>
        <div class="spot" id="sp3" style="background: radial-gradient(ellipse 55% 45% at 50% 30%, rgba(102,153,51,0.38) 0%, rgba(102,153,51,0) 70%)"></div>
        <div id="floor"></div>

        <div class="unit" id="u1">
          <div class="shadow"></div>
          <img class="pk" src="assets/pack-beer.png" alt="" />
          <div class="lp-sh" style="left: 150px; top: 1352px; width: 150px; height: 24px"></div><img class="lp" src="assets/puff0.png" alt="" style="left: 160px; top: 1250px; width: 130px; transform: scaleY(0.62) rotate(-8deg)" />
          <div class="lp-sh" style="left: 790px; top: 1362px; width: 120px; height: 20px"></div><img class="lp" src="assets/puff5.png" alt="" style="left: 800px; top: 1288px; width: 100px; transform: scaleY(0.6) rotate(12deg)" />
        </div>
        <div class="unit" id="u2">
          <div class="shadow"></div>
          <img class="pk" src="assets/pack-whiskey.png" alt="" />
          <div class="lp-sh" style="left: 170px; top: 1360px; width: 130px; height: 22px"></div><img class="lp" src="assets/puff4.png" alt="" style="left: 180px; top: 1275px; width: 110px; transform: scaleY(0.6) rotate(6deg)" />
          <div class="lp-sh" style="left: 780px; top: 1350px; width: 150px; height: 24px"></div><img class="lp" src="assets/puff0.png" alt="" style="left: 790px; top: 1250px; width: 130px; transform: scaleY(0.62) rotate(-14deg)" />
        </div>
        <div class="unit" id="u3">
          <div class="shadow"></div>
          <img class="pk" src="assets/pack-rum.png" alt="" style="top: 660px" />
          <div class="lp-sh" style="left: 150px; top: 1350px; width: 150px; height: 24px"></div><img class="lp" src="assets/puff5.png" alt="" style="left: 160px; top: 1250px; width: 130px; transform: scaleY(0.62) rotate(10deg)" />
          <div class="lp-sh" style="left: 800px; top: 1362px; width: 110px; height: 20px"></div><img class="lp" src="assets/puff4.png" alt="" style="left: 810px; top: 1292px; width: 92px; transform: scaleY(0.6) rotate(-6deg)" />
        </div>

        <div class="eyebrow" id="e1" style="color: var(--mustard)">01 — For beer</div>
        <div class="head" id="h1"><span class="mask"><span class="ln">Sharp.</span></span><span class="mask"><span class="ln" style="color: var(--mustard)">Herby.</span></span></div>
        <div class="fname" id="f1" style="color: var(--mustard)">Cheddar &amp; Herbs</div>
        <div class="fsub" id="g1">Jowar puffs · 35 g</div>

        <div class="eyebrow" id="e2" style="color: var(--purple-lt)">02 — For whiskey</div>
        <div class="head" id="h2"><span class="mask"><span class="ln">Deep.</span></span><span class="mask"><span class="ln" style="color: var(--purple-lt)">Toasty.</span></span></div>
        <div class="fname" id="f2" style="color: var(--purple-lt)">Toasted Sesame Umami</div>
        <div class="fsub" id="g2">Jowar puffs · 35 g</div>

        <div class="eyebrow" id="e3" style="color: var(--green-lt)">03 — For rum</div>
        <div class="head" id="h3"><span class="mask"><span class="ln">Warm.</span></span><span class="mask"><span class="ln" style="color: var(--green-lt)">Tropical.</span></span></div>
        <div class="fname" id="f3" style="color: var(--green-lt)">Coconut &amp; Spices</div>
        <div class="fsub" id="g3">Jowar puffs · 35 g</div>
      </section>

      <!-- END SLATE 9.0–12 -->
      <section id="cE" class="clip" style="z-index: 3" data-start="9.0" data-duration="3.0" data-track-index="1">
        <div class="fill" id="sl-bg"></div><div id="sl-pat"></div>
        <div id="sl-stage">
          <img id="sl-logo" src="assets/logo.svg" alt="DrinksBite" />
          <div id="sl-rule"></div>
          <div id="sl-floor"></div>
          <div class="sl-sh" id="ss1" style="left: 80px; width: 320px"></div>
          <div class="sl-sh" id="ss2" style="left: 360px; width: 360px"></div>
          <div class="sl-sh" id="ss3" style="left: 680px; width: 320px"></div>
          <div id="sl-row">
            <img class="sl-pk" id="sp-w" src="assets/pack-whiskey.png" alt="" style="left: 95px; top: 1002px; width: 300px" />
            <img class="sl-pk" id="sp-r" src="assets/pack-rum.png" alt="" style="left: 685px; top: 1016px; width: 300px" />
            <img class="sl-pk" id="sp-b" src="assets/pack-beer.png" alt="" style="left: 370px; top: 942px; width: 340px" />
          </div>
          <div id="sl-tag">Pair · Sip · Repeat</div>
          <div id="sl-handle">@drinksbite_official</div>
        </div>
      </section>

      <section id="fx" class="clip" style="z-index: 20" data-start="0" data-duration="12" data-track-index="6"><div class="fill" id="vig"></div><div id="grain"></div></section>
      <audio id="bgm" src="assets/soundtrack.wav" data-start="0" data-duration="12" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      for (let k = 0, f = 0; f < 12; k++, f += 1 / 12) tl.set("#grain", { x: ((k * 137) % 200) - 100, y: ((k * 89) % 200) - 100 }, f);

      /* ---------- HOOK: hard cuts every 0.3 s, same centre, slow continuous spin ---------- */
      const cuts = [["#d0", "#w0", 0.0], ["#d1", "#w1", 0.3], ["#d2", "#w2", 0.6], ["#d3", "#w3", 0.9]];
      cuts.forEach(([d, w, t], i) => {
        tl.set(d, { opacity: 1 }, t);
        tl.fromTo(d, { scale: 1.08, rotation: i * 25 }, { scale: 1.0, rotation: i * 25 + 12, duration: 0.3, ease: "power2.out" }, t);
        if (i < 3) tl.set(d, { opacity: 0 }, t + 0.3);
        tl.set(w, { opacity: 1 }, t);
        if (i < 3) tl.set(w, { opacity: 0 }, t + 0.3);
      });
      tl.set(["#d1", "#d2", "#d3"], { opacity: 0 }, 0);
      // 1.2: last disc splits into a row of three (match-move), then the line lands
      tl.set(["#d1", "#d2"], { opacity: 1 }, 1.2);
      tl.set("#w3", { opacity: 0 }, 1.2);
      tl.fromTo("#d2", { x: 0, scale: 1 }, { x: -340, scale: 0.48, duration: 0.45, ease: "power3.inOut" }, 1.2);
      tl.fromTo("#d1", { x: 0, scale: 1 }, { x: 0, scale: 0.48, duration: 0.45, ease: "power3.inOut" }, 1.2);
      tl.to("#d3", { x: 340, scale: 0.48, duration: 0.45, ease: "power3.inOut" }, 1.2);
      tl.fromTo("#hook-line", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.45);
      tl.to(["#d1", "#d2", "#d3"], { rotation: "+=30", duration: 0.8, ease: "none" }, 1.65);
      // 2.1: centre disc pushes in to fill frame (iris into the studio)
      tl.to("#d1", { scale: 4.5, duration: 0.35, ease: "power3.in" }, 2.1);
      tl.to(["#d2", "#d3", "#hook-line"], { opacity: 0, duration: 0.15 }, 2.1);

      /* ---------- STAGE: packs travel through centre, type reveals per flavour ---------- */
      const T = [2.4, 4.6, 6.8];
      tl.fromTo("#cS", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 2.4);
      // spotlights crossfade
      tl.to("#sp1", { opacity: 1, duration: 0.5 }, 2.4);
      tl.to("#sp1", { opacity: 0, duration: 0.4 }, 4.5); tl.to("#sp2", { opacity: 1, duration: 0.5 }, 4.5);
      tl.to("#sp2", { opacity: 0, duration: 0.4 }, 6.7); tl.to("#sp3", { opacity: 1, duration: 0.5 }, 6.7);
      // units: enter from right, hold with a slow drift, exit left — continuous camera-truck feel
      ["#u1", "#u2", "#u3"].forEach((u, i) => {
        const t = T[i];
        tl.fromTo(u, { x: i === 0 ? 0 : 1100 }, { x: 0, duration: i === 0 ? 0.01 : 0.55, ease: "power3.out" }, i === 0 ? t : t - 0.05);
        if (i === 0) tl.fromTo(u + " .pk", { y: 60, scale: 1.12 }, { y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t);
        tl.to(u, { x: -40, duration: 1.6, ease: "none" }, t + 0.5);
        if (i < 2) tl.to(u, { x: -1150, duration: 0.55, ease: "power3.in" }, T[i + 1] - 0.45);
        else tl.to(u + " .pk", { scale: 1.06, duration: 0.6, ease: "power2.in" }, 8.5);
      });
      ["1", "2", "3"].forEach((n, i) => {
        const t = T[i];
        tl.fromTo("#e" + n, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t + 0.15);
        tl.fromTo("#h" + n + " .ln", { yPercent: 105 }, { yPercent: 0, duration: 0.55, stagger: 0.09, ease: "expo.out" }, t + 0.2);
        tl.fromTo("#f" + n, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t + 0.45);
        tl.fromTo("#g" + n, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t + 0.6);
        if (i < 2) {
          const out = T[i + 1] - 0.4;
          tl.to("#h" + n + " .ln", { yPercent: -105, duration: 0.35, stagger: 0.05, ease: "power3.in" }, out);
          tl.to(["#e" + n, "#f" + n, "#g" + n], { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, out);
        }
      });
      tl.to("#cS", { opacity: 0, duration: 0.15 }, 8.95);

      /* ---------- END SLATE ---------- */
      tl.fromTo("#sl-stage", { scale: 1.0 }, { scale: 1.03, duration: 3.0, ease: "none" }, 9.0);
      tl.fromTo("#sl-logo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 9.05);
      tl.fromTo("#sl-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 9.4);
      [["#sp-w", "#ss1", 9.35], ["#sp-b", "#ss2", 9.47], ["#sp-r", "#ss3", 9.59]].forEach(([p, s, t]) => {
        tl.fromTo(p, { y: 520 }, { y: 0, duration: 0.6, ease: "power3.out" }, t);
        tl.fromTo(s, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, t + 0.25);
      });
      tl.fromTo("#sl-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.0);
      tl.fromTo("#sl-handle", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 10.25);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
