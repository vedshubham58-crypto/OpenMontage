<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DrinksBite — The Smart Bite (label cut)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geometr706 BlkCn"; src: url("assets/geometr.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Aprilio Hope"; src: url("assets/aprilio.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Bernard MT Condensed"; src: url("assets/bernard.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Berlin Sans FB"; src: url("assets/berlin.ttf") format("truetype"); font-display: block; }
      :root {
        --ink: #171717; --deep: #0e0e0e; --cream: #f5f0ea; --mustard: #f7b733; --hair: rgba(245,240,234,0.18);
        --display: "Geometr706 BlkCn", "Arial Narrow", sans-serif; --label: "Berlin Sans FB", sans-serif;
        --flavour: "Bernard MT Condensed", serif; --body: "Aprilio Hope", sans-serif;
      }
      html, body { margin: 0; padding: 0; background: var(--deep); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--cream); text-transform: uppercase; }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .fill { position: absolute; inset: 0; }
      .mask { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
      .ln { display: block; }
      .kick { font-family: var(--label); font-size: 26px; letter-spacing: 12px; color: rgba(245,240,234,0.5); }

      /* STAGE (hook + spec, one continuous shot) */
      #st-glow { background: radial-gradient(ellipse 55% 35% at 60% 50%, rgba(247,183,51,0.16) 0%, rgba(247,183,51,0) 70%); }
      #horizon { position: absolute; left: 90px; top: 1386px; width: 900px; height: 2px; background: var(--mustard); }
      #floor { position: absolute; left: 0; right: 0; top: 1387px; height: 400px; background: linear-gradient(180deg, rgba(247,183,51,0.06) 0%, rgba(247,183,51,0) 60%); }
      #rise { position: absolute; left: 0; top: 0; width: 1080px; height: 1387px; overflow: hidden; }
      #pk { position: absolute; left: 400px; top: 640px; width: 520px; height: 745px; }
      #pk img { position: absolute; inset: 0; width: 520px; height: 745px; display: block; }
      #pk .sheen { position: absolute; inset: 0; -webkit-mask-image: url(assets/pack-beer.png); mask-image: url(assets/pack-beer.png); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; overflow: hidden; }
      #pk .sheen i { position: absolute; top: -10%; left: 0; width: 30%; height: 120%; display: block;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,250,240,0.32) 50%, rgba(255,255,255,0) 100%); }
      #pk-sh { position: absolute; left: 420px; top: 1366px; width: 480px; height: 44px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%); }
      #headline { position: absolute; left: 90px; top: 270px; font-family: var(--display); font-size: 132px; line-height: 0.95; }
      #callouts { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      #callouts circle { fill: var(--mustard); }
      #callouts path { fill: none; stroke: var(--mustard); stroke-width: 2; }
      .co { position: absolute; left: 90px; font-family: var(--label); font-size: 26px; letter-spacing: 6px; line-height: 1.5; color: var(--cream); }
      .co b { color: var(--mustard); font-weight: normal; display: block; }
      #s-kick { position: absolute; left: 90px; top: 700px; }
      .row { position: absolute; left: 90px; width: 480px; }
      .row .rule { display: block; width: 480px; height: 1px; background: var(--hair); }
      .row .num { display: block; font-family: var(--label); font-size: 24px; letter-spacing: 6px; color: var(--mustard); margin-top: 26px; }
      .row .txt { display: block; font-family: var(--display); font-size: 56px; line-height: 1.02; margin-top: 8px; white-space: nowrap; }

      /* PAYOFF */
      #p-photo { position: absolute; left: -40px; top: -40px; width: 1160px; height: 2000px; object-fit: cover; display: block; filter: brightness(0.62) saturate(0.95); }
      #p-shade { background: linear-gradient(180deg, rgba(14,14,14,0.2) 0%, rgba(14,14,14,0) 40%, rgba(14,14,14,0.85) 72%, rgba(14,14,14,0.95) 100%); }
      #p-text { position: absolute; left: 90px; top: 1300px; font-family: var(--display); font-size: 116px; line-height: 0.95; }
      #p-rule { position: absolute; left: 90px; top: 1260px; width: 120px; height: 3px; background: var(--mustard); }

      /* END SLATE (shared) */
      #sl-bg { background: radial-gradient(ellipse 70% 40% at 50% 8%, rgba(245,240,234,0.08) 0%, rgba(245,240,234,0) 70%), var(--ink); }
      #sl-pat { position: absolute; inset: -100px; background-image: url("assets/pattern.png"); background-size: 378px 195px; opacity: 0.2; }
      #sl-stage { position: absolute; inset: 0; }
      #sl-logo { position: absolute; left: 50%; top: 300px; width: 340px; height: 331px; margin-left: -170px; display: block; }
      #sl-rule { position: absolute; left: 470px; top: 700px; width: 140px; height: 3px; background: var(--mustard); }
      #sl-floor { position: absolute; left: 0; right: 0; top: 1420px; height: 500px; background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%); }
      #sl-row { position: absolute; left: 0; top: 0; width: 1080px; height: 1430px; overflow: hidden; }
      .sl-pk { position: absolute; display: block; height: auto; }
      .sl-sh { position: absolute; top: 1404px; height: 46px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%); }
      #sl-tag { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: var(--label); font-size: 40px; letter-spacing: 16px; }
      #sl-handle { position: absolute; left: 0; right: 0; top: 1570px; text-align: center; font-family: var(--label); font-size: 30px; letter-spacing: 4px; color: rgba(245,240,234,0.55); text-transform: none; }
      #grain { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; background-image: url("assets/grain.png"); background-size: 512px 512px; opacity: 0.05; mix-blend-mode: overlay; }
      #vig { background: radial-gradient(ellipse 85% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="12" data-fps="30">

      <!-- STAGE 0–6.45: label hook → spec, one continuous move -->
      <section id="cS" class="clip" style="z-index: 1" data-start="0" data-duration="6.45" data-track-index="1">
        <div class="fill" style="background: var(--deep)"></div>
        <div class="fill" id="st-glow"></div>
        <div id="floor"></div>
        <div id="horizon"></div>
        <div id="pk-sh"></div>
        <div id="rise">
          <div id="pk">
            <img src="assets/pack-beer.png" alt="" />
            <div class="sheen"><i id="sheen"></i></div>
          </div>
        </div>
        <div id="headline"><span class="mask"><span class="ln">Smart drinkers</span></span><span class="mask"><span class="ln" style="color: var(--mustard)">read the label.</span></span></div>
        <svg id="callouts" viewBox="0 0 1080 1920">
          <circle id="d1" cx="478" cy="1000" r="7" />
          <path id="l1" d="M478 1000 L 380 1000 L 330 950 L 90 950" />
          <circle id="d2" cx="500" cy="1212" r="7" />
          <path id="l2" d="M500 1212 L 380 1212 L 330 1262 L 90 1262" />
        </svg>
        <div class="co" id="co1" style="top: 867px"><span class="mask"><span class="ln"><b>Made with</b></span></span><span class="mask"><span class="ln">jowar</span></span></div>
        <div class="co" id="co2" style="top: 1277px"><span class="mask"><span class="ln"><b>Popped,</b></span></span><span class="mask"><span class="ln">not fried</span></span></div>

        <div class="kick" id="s-kick">What's inside</div>
        <div class="row" id="r1" style="top: 760px"><i class="rule"></i><span class="num">01</span><span class="mask"><span class="ln txt">Popped, not fried.</span></span></div>
        <div class="row" id="r2" style="top: 940px"><i class="rule"></i><span class="num">02</span><span class="mask"><span class="ln txt">No palm oil.</span></span></div>
        <div class="row" id="r3" style="top: 1120px"><i class="rule"></i><span class="num">03</span><span class="mask"><span class="ln txt">Trans fat free.</span></span></div>
      </section>

      <!-- PAYOFF 6.4–9.05 -->
      <section id="cP" class="clip" style="z-index: 3" data-start="6.4" data-duration="2.65" data-track-index="2">
        <img id="p-photo" src="assets/pour-whiskey.jpg" alt="" />
        <div class="fill" id="p-shade"></div>
        <div id="p-rule"></div>
        <div id="p-text"><span class="mask"><span class="ln">Smart pours</span></span><span class="mask"><span class="ln">deserve</span></span><span class="mask"><span class="ln" style="color: var(--mustard)">smarter bites.</span></span></div>
      </section>

      <!-- END SLATE 9.0–12 -->
      <section id="cE" class="clip" style="z-index: 4" data-start="9.0" data-duration="3.0" data-track-index="1">
        <div class="fill" id="sl-bg"></div><div id="sl-pat"></div>
        <div id="sl-stage">
          <img id="sl-logo" src="assets/logo.svg" alt="DrinksBite" />
          <div id="sl-rule"></div>
          <div id="sl-floor"></div>
          <div class="sl-sh" id="ss1" style="left: 80px; width: 320px"></div>
          <div class="sl-sh" id="ss2" style="left: 360px; width: 360px"></div>
          <div class="sl-sh" id="ss3" style="left: 680px; width: 320px"></div>
          <div id="sl-row">
            <img class="sl-pk" id="sp-w" src="assets/pack-whiskey.png" alt="" style="left: 95px; top: 1002px; width: 300px" />
            <img class="sl-pk" id="sp-r" src="assets/pack-rum.png" alt="" style="left: 685px; top: 1016px; width: 300px" />
            <img class="sl-pk" id="sp-b" src="assets/pack-beer.png" alt="" style="left: 370px; top: 942px; width: 340px" />
          </div>
          <div id="sl-tag">Pair · Sip · Repeat</div>
          <div id="sl-handle">@drinksbite_official</div>
        </div>
      </section>

      <section id="fx" class="clip" style="z-index: 20" data-start="0" data-duration="12" data-track-index="6"><div class="fill" id="vig"></div><div id="grain"></div></section>
      <audio id="bgm" src="assets/soundtrack.wav" data-start="0" data-duration="12" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      for (let k = 0, f = 0; f < 12; k++, f += 1 / 12) tl.set("#grain", { x: ((k * 137) % 200) - 100, y: ((k * 89) % 200) - 100 }, f);
      const up = (sel, t, st = 0.1, d = 0.7) => tl.fromTo(sel, { yPercent: 115 }, { yPercent: 0, duration: d, stagger: st, ease: "expo.out" }, t);

      /* ---------- HOOK: the reveal ---------- */
      tl.fromTo("#horizon", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.05);
      up("#headline .ln", 0.12, 0.3, 0.8);
      tl.fromTo("#pk", { y: 780 }, { y: 0, duration: 1.0, ease: "expo.out" }, 0.35);
      tl.fromTo("#pk-sh", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.75);
      tl.fromTo("#st-glow", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 0.5);
      tl.fromTo("#pk img", { scale: 1.0 }, { scale: 1.03, duration: 2.0, ease: "none" }, 1.0);
      tl.fromTo("#sheen", { xPercent: -140 }, { xPercent: 380, duration: 0.85, ease: "power2.inOut" }, 1.15);
      [["#d1", "#l1", "#co1", 1.65], ["#d2", "#l2", "#co2", 1.95]].forEach(([d, l, c, t]) => {
        tl.fromTo(d, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, t);
        tl.fromTo(l, { strokeDasharray: 600, strokeDashoffset: 600 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t + 0.05);
        up(c + " .ln", t + 0.3, 0.08, 0.5);
      });

      /* ---------- MOVE: callouts clear, pack glides into the spec position ---------- */
      tl.to(["#callouts", "#co1", "#co2"], { opacity: 0, duration: 0.3 }, 2.75);
      tl.to("#headline .ln", { yPercent: -115, duration: 0.4, stagger: 0.06, ease: "power3.in" }, 2.8);
      tl.to("#pk", { x: 220, y: 20, scale: 0.75, transformOrigin: "0% 0%", duration: 0.8, ease: "power3.inOut" }, 3.0);
      tl.to("#pk-sh", { x: 155, y: -166, scaleX: 0.8, duration: 0.8, ease: "power3.inOut" }, 3.0);
      tl.to("#horizon", { scaleX: 0, duration: 0.5, ease: "power3.in", transformOrigin: "100% 50%" }, 3.0);
      tl.to("#floor", { opacity: 0, duration: 0.5 }, 3.0);

      /* ---------- SPEC ---------- */
      tl.fromTo("#s-kick", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.4);
      [["#r1", 3.5], ["#r2", 4.1], ["#r3", 4.7]].forEach(([r, t]) => {
        tl.fromTo(r + " .rule", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, t);
        tl.fromTo(r + " .num", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t + 0.1);
        up(r + " .ln", t + 0.12, 0, 0.6);
      });
      tl.to("#pk", { y: 8, duration: 2.4, ease: "sine.inOut" }, 3.8);
      tl.to(["#cS .row", "#s-kick"], { opacity: 0, duration: 0.25 }, 6.2);

      /* ---------- PAYOFF ---------- */
      tl.fromTo("#p-photo", { scale: 1.12 }, { scale: 1.02, duration: 2.65, ease: "power1.out" }, 6.4);
      tl.fromTo("#p-rule", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 6.7);
      up("#p-text .ln", 6.75, 0.2, 0.7);

      /* ---------- END SLATE ---------- */
      tl.fromTo("#sl-stage", { scale: 1.0 }, { scale: 1.03, duration: 3.0, ease: "none" }, 9.0);
      tl.fromTo("#sl-logo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 9.05);
      tl.fromTo("#sl-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 9.4);
      [["#sp-w", "#ss1", 9.35], ["#sp-b", "#ss2", 9.47], ["#sp-r", "#ss3", 9.59]].forEach(([p, s, t]) => {
        tl.fromTo(p, { y: 520 }, { y: 0, duration: 0.6, ease: "power3.out" }, t);
        tl.fromTo(s, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, t + 0.25);
      });
      tl.fromTo("#sl-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.0);
      tl.fromTo("#sl-handle", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 10.25);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
