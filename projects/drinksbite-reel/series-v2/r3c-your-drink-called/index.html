<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DrinksBite — Your Drink Called (classic cut)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geometr706 BlkCn"; src: url("assets/geometr.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Aprilio Hope"; src: url("assets/aprilio.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Bernard MT Condensed"; src: url("assets/bernard.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Berlin Sans FB"; src: url("assets/berlin.ttf") format("truetype"); font-display: block; }
      :root {
        --ink: #171717; --deep: #111111; --cream: #f5f0ea; --mustard: #f7b733; --purple-lt: #b48fd0; --green-lt: #8cc152;
        --display: "Geometr706 BlkCn", "Arial Narrow", sans-serif; --label: "Berlin Sans FB", sans-serif;
        --flavour: "Bernard MT Condensed", serif; --body: "Aprilio Hope", sans-serif;
      }
      html, body { margin: 0; padding: 0; background: var(--deep); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--cream); text-transform: uppercase; }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .fill { position: absolute; inset: 0; }
      .mask { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
      .ln { display: block; }
      #pat { position: absolute; inset: -100px; background-image: url("assets/pattern.png"); background-size: 378px 195px; opacity: 0.08; }
      #spot { background: radial-gradient(ellipse 60% 38% at 50% 0%, rgba(245,240,234,0.07) 0%, rgba(245,240,234,0) 70%); }

      #stage { position: absolute; inset: 0; }
      #cam { position: absolute; left: 0; top: 0; width: 3240px; height: 1920px; }
      .counter { position: absolute; top: 1180px; width: 680px; height: 2px;
        background: linear-gradient(90deg, rgba(245,240,234,0) 0%, rgba(245,240,234,0.35) 20%, rgba(245,240,234,0.35) 80%, rgba(245,240,234,0) 100%); }
      .glow { position: absolute; border-radius: 50%; opacity: 0; }
      .ls { position: absolute; overflow: hidden; -webkit-mask-image: linear-gradient(to top, transparent 0px, black 70px, black 55%, transparent 100%); mask-image: linear-gradient(to top, transparent 0px, black 70px, black 55%, transparent 100%); }
      .ls .flow { position: absolute; left: 0; top: 0; }
      .ls .flow img { position: absolute; left: 0; display: block; }
      .lg { position: absolute; overflow: hidden; }
      .lg img { position: absolute; left: 0; top: 0; display: block; }
      .pk { position: absolute; display: block; height: auto; }
      .refl { position: absolute; top: 1182px; height: 300px; overflow: hidden; opacity: 0;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 80%); mask-image: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 80%); }
      .refl img { position: absolute; top: 0; display: block; transform: scaleY(-1); transform-origin: 50% 0%; }

      .eyebrow { position: absolute; left: 0; right: 0; top: 236px; text-align: center; font-family: var(--label); font-size: 24px; letter-spacing: 14px; }
      .head { position: absolute; left: 0; right: 0; top: 284px; text-align: center; font-family: var(--display); font-size: 100px; line-height: 0.98; }
      .foot { position: absolute; left: 0; right: 0; top: 1478px; text-align: center; }
      .foot b { display: block; font-family: var(--flavour); font-weight: normal; font-size: 56px; line-height: 1; letter-spacing: 1px; }
      .foot i { display: block; font-style: normal; font-family: var(--label); font-size: 22px; letter-spacing: 12px; margin-top: 16px; color: rgba(245,240,234,0.5); }

      /* end slate (shared) */
      #sl-bg { background: radial-gradient(ellipse 70% 40% at 50% 8%, rgba(245,240,234,0.08) 0%, rgba(245,240,234,0) 70%), var(--ink); }
      #sl-pat { position: absolute; inset: -100px; background-image: url("assets/pattern.png"); background-size: 378px 195px; opacity: 0.2; }
      #sl-stage { position: absolute; inset: 0; }
      #sl-logo { position: absolute; left: 50%; top: 300px; width: 340px; height: 331px; margin-left: -170px; display: block; }
      #sl-rule { position: absolute; left: 470px; top: 700px; width: 140px; height: 3px; background: var(--mustard); }
      #sl-floor { position: absolute; left: 0; right: 0; top: 1420px; height: 500px; background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%); }
      #sl-row { position: absolute; left: 0; top: 0; width: 1080px; height: 1430px; overflow: hidden; }
      .sl-pk { position: absolute; display: block; height: auto; }
      .sl-sh { position: absolute; top: 1404px; height: 46px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%); }
      #sl-tag { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: var(--label); font-size: 40px; letter-spacing: 16px; }
      #sl-handle { position: absolute; left: 0; right: 0; top: 1570px; text-align: center; font-family: var(--label); font-size: 30px; letter-spacing: 4px; color: rgba(245,240,234,0.55); text-transform: none; }
      #grain { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; background-image: url("assets/grain.png"); background-size: 512px 512px; opacity: 0.05; mix-blend-mode: overlay; }
      #vig { background: radial-gradient(ellipse 85% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="12.5" data-fps="30">

      <section id="cB" class="clip" style="z-index: 1" data-start="0" data-duration="9.55" data-track-index="1">
        <div class="fill" style="background: var(--deep)"></div><div id="pat"></div><div class="fill" id="spot"></div>
        <div id="stage"><div id="cam"></div></div>

        <div class="eyebrow" id="eA" style="color: var(--mustard)">01 — For beer</div>
        <div class="head" id="hA"><span class="mask"><span class="ln">Your beer</span></span><span class="mask"><span class="ln" style="color: var(--mustard)">is lonely.</span></span></div>
        <div class="head" id="hA2"><span class="mask"><span class="ln">Not</span></span><span class="mask"><span class="ln" style="color: var(--mustard)">anymore.</span></span></div>
        <div class="eyebrow" id="eB" style="color: var(--purple-lt)">02 — For whiskey</div>
        <div class="head" id="hB"><span class="mask"><span class="ln">Your whiskey</span></span><span class="mask"><span class="ln" style="color: var(--purple-lt)">deserves better.</span></span></div>
        <div class="eyebrow" id="eC" style="color: var(--green-lt)">03 — For rum</div>
        <div class="head" id="hC"><span class="mask"><span class="ln">Your rum</span></span><span class="mask"><span class="ln" style="color: var(--green-lt)">wants company.</span></span></div>

        <div class="foot" id="fA"><b style="color: var(--mustard)">Cheddar &amp; Herbs</b><i>Jowar puffs · 35 g</i></div>
        <div class="foot" id="fB"><b style="color: var(--purple-lt)">Toasted Sesame Umami</b><i>Jowar puffs · 35 g</i></div>
        <div class="foot" id="fC"><b style="color: var(--green-lt)">Coconut &amp; Spices</b><i>Jowar puffs · 35 g</i></div>
      </section>

      <!-- END SLATE 9.5–12.5 -->
      <section id="cE" class="clip" style="z-index: 2" data-start="9.5" data-duration="3.0" data-track-index="2">
        <div class="fill" id="sl-bg"></div><div id="sl-pat"></div>
        <div id="sl-stage">
          <img id="sl-logo" src="assets/logo.svg" alt="DrinksBite" />
          <div id="sl-rule"></div>
          <div id="sl-floor"></div>
          <div class="sl-sh" id="ss1" style="left: 80px; width: 320px"></div>
          <div class="sl-sh" id="ss2" style="left: 360px; width: 360px"></div>
          <div class="sl-sh" id="ss3" style="left: 680px; width: 320px"></div>
          <div id="sl-row">
            <img class="sl-pk" id="sp-w" src="assets/pack-whiskey.png" alt="" style="left: 95px; top: 1002px; width: 300px" />
            <img class="sl-pk" id="sp-r" src="assets/pack-rum.png" alt="" style="left: 685px; top: 1016px; width: 300px" />
            <img class="sl-pk" id="sp-b" src="assets/pack-beer.png" alt="" style="left: 370px; top: 942px; width: 340px" />
          </div>
          <div id="sl-tag">Pair · Sip · Repeat</div>
          <div id="sl-handle">@drinksbite_official</div>
        </div>
      </section>

      <section id="fx" class="clip" style="z-index: 20" data-start="0" data-duration="12.5" data-track-index="6"><div class="fill" id="vig"></div><div id="grain"></div></section>
      <audio id="bgm" src="assets/soundtrack.wav" data-start="0" data-duration="12.5" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      /* ---------- build the three centred product pairs (deterministic) ---------- */
      const C = 1180, ST = 470;
      const PAIRS = [
        { n: "beer",    glass: [277, 729, 231, 451], sh: 469, pack: [552, 822, 250, 358], glow: "rgba(247,183,51,0.20)" },
        { n: "whiskey", glass: [291, 947, 203, 233], sh: 687, pack: [538, 825, 250, 355], glow: "rgba(138,91,170,0.30)" },
        { n: "rum",     glass: [284, 894, 218, 286], sh: 634, pack: [546, 835, 250, 345], glow: "rgba(102,153,51,0.30)" },
      ];
      const cam = document.getElementById("cam");
      const el = (tag, cls, id, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (id) e.id = id; e.style.cssText = css; if (html) e.innerHTML = html; cam.appendChild(e); return e; };
      PAIRS.forEach((p, i) => {
        const o = i * 1080, k = i + 1, [gx, gy, gw, gh] = p.glass, [px, py, pw, ph] = p.pack;
        el("div", "glow", "gw" + k, `left:${o + gx - 120}px;top:${gy - 120}px;width:${gw + 240}px;height:${gh + 200}px;background:radial-gradient(ellipse at 50% 60%, ${p.glow} 0%, rgba(0,0,0,0) 70%)`);
        el("div", "counter", "", `left:${o + 200}px`);
        const cH = gy - ST;
        el("div", "ls", "ls" + k, `left:${o + gx}px;top:${ST}px;width:${gw}px;height:${cH}px`,
          `<div class="flow" id="fl${k}"><img src="assets/la-stream-${p.n}.png" style="top:${cH - p.sh}px;width:${gw}px;height:${p.sh}px" alt=""/><img src="assets/la-stream-${p.n}.png" style="top:${cH}px;width:${gw}px;height:${p.sh}px" alt=""/></div>`);
        el("div", "lg", "lg" + k, `left:${o + gx}px;top:${gy}px;width:${gw}px;height:${gh}px`,
          `<img id="lgi${k}" src="assets/la-glass-${p.n}.png" style="width:${gw}px;height:${gh}px" alt=""/>`);
        el("img", "pk", "pk" + k, `left:${o + px}px;top:${py}px;width:${pw}px`).src = "assets/pack-" + p.n + ".png";
        el("div", "refl", "rf" + k, `left:${o}px;width:1080px`,
          `<img src="assets/la-glass-${p.n}.png" style="left:${gx}px;width:${gw}px;height:${gh}px" alt=""/><img id="rfp${k}" src="assets/pack-${p.n}.png" style="left:${px}px;width:${pw}px;height:${ph}px" alt=""/>`);
      });
      // the hook puff, resting in front of the pair
      el("img", "pk", "pz", "left:494px;top:1092px;width:88px").src = "assets/puff0.png";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      for (let k = 0, f = 0; f < 12.5; k++, f += 1 / 12) tl.set("#grain", { x: ((k * 137) % 200) - 100, y: ((k * 89) % 200) - 100 }, f);

      /* camera: barely-there dolly within a beat, smooth truck between beats */
      tl.set("#cam", { x: 20 }, 0);
      tl.to("#cam", { x: -20, duration: 2.95, ease: "none" }, 0);
      [[2.95, 1], [5.75, 2]].forEach(([t, i]) => {
        tl.to("#cam", { x: -1080 * i + 20, duration: 0.8, ease: "power3.inOut" }, t);
        tl.to("#cam", { x: -1080 * i - 20, duration: i === 1 ? 2.0 : 2.45, ease: "none" }, t + 0.8);
      });

      /* bubbles drift upward the whole time, dissolving before the headline */
      PAIRS.forEach((p, i) => tl.fromTo("#fl" + (i + 1), { y: 0 }, { y: -p.sh * 0.9, duration: 9.5, ease: "none" }, 0));

      /* products arrive: glass rises from the counter, pack sets down, reflection follows */
      const arrive = (k, t) => {
        tl.fromTo("#lg" + k, { yPercent: 100 }, { yPercent: 0, duration: 0.8, ease: "power3.out" }, t);
        tl.fromTo("#lgi" + k, { yPercent: -100 }, { yPercent: 0, duration: 0.8, ease: "power3.out" }, t);
        tl.fromTo("#gw" + k, { opacity: 0 }, { opacity: 1, duration: 0.9 }, t + 0.2);
        tl.fromTo("#rf" + k, { opacity: 0 }, { opacity: 1, duration: 0.8 }, t + 0.4);
      };
      const setDown = (k, t) => {
        tl.fromTo("#pk" + k, { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
        tl.fromTo("#rfp" + k, { opacity: 0 }, { opacity: 1, duration: 0.45 }, t);
      };
      const up = (sel, t) => tl.fromTo(sel + " .ln", { yPercent: 115 }, { yPercent: 0, duration: 0.6, stagger: 0.08, ease: "expo.out" }, t);
      const out = (sel, t) => tl.to(sel + " .ln", { yPercent: -115, duration: 0.3, stagger: 0.04, ease: "power3.in" }, t);
      const fade = (sel, t, o = 1, d = 0.45) => tl.fromTo(sel, { opacity: o ? 0 : 1 }, { opacity: o, duration: d, ease: "power2.out", immediateRender: !!o }, t);

      /* BEAT A — hook */
      arrive(1, 0.1);
      fade("#eA", 0.1); up("#hA", 0.15);
      tl.fromTo("#pz", { y: -1100, rotation: -60 }, { y: 0, rotation: 0, duration: 0.42, ease: "power2.in" }, 1.2);
      tl.to("#pz", { scaleY: 0.82, scaleX: 1.08, duration: 0.06, transformOrigin: "50% 100%" }, 1.62);
      tl.to("#pz", { scaleY: 1, scaleX: 1, duration: 0.3, ease: "power2.out", transformOrigin: "50% 100%" }, 1.68);
      out("#hA", 1.62); up("#hA2", 1.78);
      setDown(1, 1.85);
      fade("#fA", 2.15);
      out("#hA2", 2.85); fade("#fA", 2.85, 0, 0.25); fade("#eA", 2.85, 0, 0.25);

      /* BEAT B */
      arrive(2, 3.25); fade("#eB", 3.45); up("#hB", 3.5); setDown(2, 3.6); fade("#fB", 4.0);
      out("#hB", 5.65); fade("#fB", 5.65, 0, 0.25); fade("#eB", 5.65, 0, 0.25);

      /* BEAT C */
      arrive(3, 6.05); fade("#eC", 6.25); up("#hC", 6.3); setDown(3, 6.4); fade("#fC", 6.8);
      out("#hC", 8.9); fade("#fC", 8.9, 0, 0.25); fade("#eC", 8.9, 0, 0.25);
      tl.to("#stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, 9.05);

      /* END SLATE (9.5) */
      tl.fromTo("#sl-stage", { scale: 1.0 }, { scale: 1.03, duration: 3.0, ease: "none" }, 9.5);
      tl.fromTo("#sl-logo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 9.55);
      tl.fromTo("#sl-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 9.9);
      [["#sp-w", "#ss1", 9.85], ["#sp-b", "#ss2", 9.97], ["#sp-r", "#ss3", 10.09]].forEach(([p, s, t]) => {
        tl.fromTo(p, { y: 520 }, { y: 0, duration: 0.6, ease: "power3.out" }, t);
        tl.fromTo(s, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, t + 0.25);
      });
      tl.fromTo("#sl-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.5);
      tl.fromTo("#sl-handle", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 10.75);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
