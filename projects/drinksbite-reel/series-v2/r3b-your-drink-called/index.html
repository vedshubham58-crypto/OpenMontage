<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DrinksBite — Your Drink Called (brand-art cut)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geometr706 BlkCn"; src: url("assets/geometr.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Aprilio Hope"; src: url("assets/aprilio.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Bernard MT Condensed"; src: url("assets/bernard.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Berlin Sans FB"; src: url("assets/berlin.ttf") format("truetype"); font-display: block; }
      :root {
        --ink: #171717; --deep: #0e0e0e; --cream: #f5f0ea; --mustard: #f7b733; --green: #669933; --purple: #8a5baa;
        --purple-lt: #b48fd0; --green-lt: #8cc152;
        --display: "Geometr706 BlkCn", "Arial Narrow", sans-serif; --label: "Berlin Sans FB", sans-serif;
        --flavour: "Bernard MT Condensed", serif; --body: "Aprilio Hope", sans-serif;
      }
      html, body { margin: 0; padding: 0; background: var(--deep); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--cream); text-transform: uppercase; }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .fill { position: absolute; inset: 0; }
      .mask { display: block; overflow: hidden; padding-bottom: 0.12em; margin-bottom: -0.12em; }
      .ln { display: block; }
      #pat { position: absolute; inset: -100px; background-image: url("assets/pattern.png"); background-size: 378px 195px; opacity: 0.16; }

      /* one long dark counter, camera trucks along it */
      #stage { position: absolute; inset: 0; }
      #cam { position: absolute; left: 0; top: 0; width: 3240px; height: 1920px; }
      #counter { position: absolute; left: 0; top: 1300px; width: 3240px; height: 2px; background: rgba(245,240,234,0.22); }
      #counter-floor { position: absolute; left: 0; top: 1302px; width: 3240px; height: 300px; background: linear-gradient(180deg, rgba(245,240,234,0.04) 0%, rgba(245,240,234,0) 100%); }
      .glow { position: absolute; border-radius: 50%; opacity: 0; }
      .ls { position: absolute; overflow: hidden; -webkit-mask-image: linear-gradient(to top, transparent 0px, black 90px, black 80%, transparent 100%); mask-image: linear-gradient(to top, transparent 0px, black 90px, black 80%, transparent 100%); }
      .ls .flow { position: absolute; left: 0; top: 0; }
      .ls .flow img { position: absolute; left: 0; display: block; }
      .lg { position: absolute; overflow: hidden; }
      .lg img { position: absolute; left: 0; top: 0; display: block; }
      .pk { position: absolute; display: block; height: auto; }
      .psh { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%); opacity: 0; }

      .head { position: absolute; left: 80px; right: 80px; top: 230px; text-align: right; font-family: var(--display); font-size: 124px; line-height: 0.95; }
      .foot { position: absolute; left: 80px; top: 1390px; }
      .foot b { display: block; font-family: var(--flavour); font-weight: normal; font-size: 68px; line-height: 1; }
      .foot i { display: block; font-style: normal; font-family: var(--label); font-size: 28px; letter-spacing: 8px; margin-top: 12px; color: rgba(245,240,234,0.6); }

      /* end slate (shared) */
      #sl-bg { background: radial-gradient(ellipse 70% 40% at 50% 8%, rgba(245,240,234,0.08) 0%, rgba(245,240,234,0) 70%), var(--ink); }
      #sl-pat { position: absolute; inset: -100px; background-image: url("assets/pattern.png"); background-size: 378px 195px; opacity: 0.2; }
      #sl-stage { position: absolute; inset: 0; }
      #sl-logo { position: absolute; left: 50%; top: 300px; width: 340px; height: 331px; margin-left: -170px; display: block; }
      #sl-rule { position: absolute; left: 470px; top: 700px; width: 140px; height: 3px; background: var(--mustard); }
      #sl-floor { position: absolute; left: 0; right: 0; top: 1420px; height: 500px; background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%); }
      #sl-row { position: absolute; left: 0; top: 0; width: 1080px; height: 1430px; overflow: hidden; }
      .sl-pk { position: absolute; display: block; height: auto; }
      .sl-sh { position: absolute; top: 1404px; height: 46px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%); }
      #sl-tag { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: var(--label); font-size: 40px; letter-spacing: 16px; }
      #sl-handle { position: absolute; left: 0; right: 0; top: 1570px; text-align: center; font-family: var(--label); font-size: 30px; letter-spacing: 4px; color: rgba(245,240,234,0.55); text-transform: none; }
      #grain { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; background-image: url("assets/grain.png"); background-size: 512px 512px; opacity: 0.05; mix-blend-mode: overlay; }
      #vig { background: radial-gradient(ellipse 85% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="12.5" data-fps="30">

      <section id="cB" class="clip" style="z-index: 1" data-start="0" data-duration="9.55" data-track-index="1">
        <div class="fill" style="background: var(--ink)"></div><div id="pat"></div>
        <div id="stage">
          <div id="cam">
            <div id="counter-floor"></div><div id="counter"></div>

            <!-- BEER (0–1080) -->
            <div class="glow" id="gw1" style="left: 80px; top: 560px; width: 460px; height: 760px; background: radial-gradient(ellipse at 50% 60%, rgba(247,183,51,0.22) 0%, rgba(247,183,51,0) 70%)"></div>
            <div class="ls" style="left: 150px; top: -15px; width: 330px; height: 670px"><div class="flow" id="fl1"><img src="assets/la-stream-beer.png" alt="" style="top: 0px; width: 330px; height: 670px" /><img src="assets/la-stream-beer.png" alt="" style="top: 670px; width: 330px; height: 670px" /></div></div>
            <div class="lg" id="lg1" style="left: 150px; top: 655px; width: 330px; height: 645px"><img id="lgi1" src="assets/la-glass-beer.png" alt="" style="width: 330px; height: 645px" /></div>
            <div class="psh" id="pb-sh" style="left: 560px; top: 1282px; width: 360px; height: 40px"></div>
            <img class="pk" id="pb" src="assets/pack-beer.png" alt="" style="left: 590px; top: 870px; width: 300px" />
            <div class="psh" id="pz-sh" style="left: 480px; top: 1288px; width: 150px; height: 26px"></div>
            <img class="pk" id="pz" src="assets/puff0.png" alt="" style="left: 495px; top: 1182px; width: 118px" />

            <!-- WHISKEY (1080–2160) -->
            <div class="glow" id="gw2" style="left: 1240px; top: 860px; width: 420px; height: 460px; background: radial-gradient(ellipse at 50% 60%, rgba(138,91,170,0.32) 0%, rgba(138,91,170,0) 70%)"></div>
            <div class="ls" style="left: 1300px; top: -15px; width: 290px; height: 982px"><div class="flow" id="fl2"><img src="assets/la-stream-whiskey.png" alt="" style="top: 0px; width: 290px; height: 982px" /><img src="assets/la-stream-whiskey.png" alt="" style="top: 982px; width: 290px; height: 982px" /></div></div>
            <div class="lg" id="lg2" style="left: 1300px; top: 967px; width: 290px; height: 333px"><img id="lgi2" src="assets/la-glass-whiskey.png" alt="" style="width: 290px; height: 333px" /></div>
            <div class="psh" id="pw-sh" style="left: 1640px; top: 1282px; width: 360px; height: 40px"></div>
            <img class="pk" id="pw" src="assets/pack-whiskey.png" alt="" style="left: 1670px; top: 875px; width: 300px" />

            <!-- RUM (2160–3240) -->
            <div class="glow" id="gw3" style="left: 2290px; top: 800px; width: 440px; height: 520px; background: radial-gradient(ellipse at 50% 60%, rgba(102,153,51,0.32) 0%, rgba(102,153,51,0) 70%)"></div>
            <div class="ls" style="left: 2350px; top: -15px; width: 312px; height: 906px"><div class="flow" id="fl3"><img src="assets/la-stream-rum.png" alt="" style="top: 0px; width: 312px; height: 906px" /><img src="assets/la-stream-rum.png" alt="" style="top: 906px; width: 312px; height: 906px" /></div></div>
            <div class="lg" id="lg3" style="left: 2350px; top: 891px; width: 312px; height: 409px"><img id="lgi3" src="assets/la-glass-rum.png" alt="" style="width: 312px; height: 409px" /></div>
            <div class="psh" id="pr-sh" style="left: 2720px; top: 1282px; width: 360px; height: 40px"></div>
            <img class="pk" id="pr" src="assets/pack-rum.png" alt="" style="left: 2750px; top: 886px; width: 300px" />
          </div>
        </div>

        <div class="head" id="hA"><span class="mask"><span class="ln">Your beer</span></span><span class="mask"><span class="ln" style="color: var(--mustard)">is lonely.</span></span></div>
        <div class="head" id="hA2"><span class="mask"><span class="ln" style="color: var(--mustard)">Not anymore.</span></span></div>
        <div class="head" id="hB"><span class="mask"><span class="ln">Your whiskey</span></span><span class="mask"><span class="ln" style="color: var(--purple-lt)">deserves better.</span></span></div>
        <div class="head" id="hC"><span class="mask"><span class="ln">Your rum</span></span><span class="mask"><span class="ln" style="color: var(--green-lt)">wants company.</span></span></div>

        <div class="foot" id="fA"><b style="color: var(--mustard)">Cheddar &amp; Herbs</b><i>Jowar puffs · made for beer</i></div>
        <div class="foot" id="fB"><b style="color: var(--purple-lt)">Toasted Sesame Umami</b><i>Jowar puffs · made for whiskey</i></div>
        <div class="foot" id="fC"><b style="color: var(--green-lt)">Coconut &amp; Spices</b><i>Jowar puffs · made for rum</i></div>
      </section>

      <!-- END SLATE 9.5–12.5 -->
      <section id="cE" class="clip" style="z-index: 2" data-start="9.5" data-duration="3.0" data-track-index="2">
        <div class="fill" id="sl-bg"></div><div id="sl-pat"></div>
        <div id="sl-stage">
          <img id="sl-logo" src="assets/logo.svg" alt="DrinksBite" />
          <div id="sl-rule"></div>
          <div id="sl-floor"></div>
          <div class="sl-sh" id="ss1" style="left: 80px; width: 320px"></div>
          <div class="sl-sh" id="ss2" style="left: 360px; width: 360px"></div>
          <div class="sl-sh" id="ss3" style="left: 680px; width: 320px"></div>
          <div id="sl-row">
            <img class="sl-pk" id="sp-w" src="assets/pack-whiskey.png" alt="" style="left: 95px; top: 1002px; width: 300px" />
            <img class="sl-pk" id="sp-r" src="assets/pack-rum.png" alt="" style="left: 685px; top: 1016px; width: 300px" />
            <img class="sl-pk" id="sp-b" src="assets/pack-beer.png" alt="" style="left: 370px; top: 942px; width: 340px" />
          </div>
          <div id="sl-tag">Pair · Sip · Repeat</div>
          <div id="sl-handle">@drinksbite_official</div>
        </div>
      </section>

      <section id="fx" class="clip" style="z-index: 20" data-start="0" data-duration="12.5" data-track-index="6"><div class="fill" id="vig"></div><div id="grain"></div></section>
      <audio id="bgm" src="assets/soundtrack.wav" data-start="0" data-duration="12.5" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      for (let k = 0, f = 0; f < 12.5; k++, f += 1 / 12) tl.set("#grain", { x: ((k * 137) % 200) - 100, y: ((k * 89) % 200) - 100 }, f);

      /* camera: slow dolly within a beat, smooth truck between beats */
      tl.set("#cam", { x: 40 }, 0);
      tl.to("#cam", { x: -30, duration: 2.95, ease: "none" }, 0);
      [[2.95, 1], [5.75, 2]].forEach(([t, i]) => {
        tl.to("#cam", { x: -1080 * i + 40, duration: 0.7, ease: "power3.inOut" }, t);
        tl.to("#cam", { x: -1080 * i - 30, duration: i === 1 ? 2.1 : 2.55, ease: "none" }, t + 0.7);
      });
      tl.fromTo("#stage", { scale: 1.04 }, { scale: 1.0, duration: 2.9, ease: "power2.out" }, 0);

      /* bubbles from every glass keep floating upward the whole time */
      [["#fl1", 600], ["#fl2", 880], ["#fl3", 815]].forEach(([f, d]) => tl.fromTo(f, { y: 0 }, { y: -d, duration: 9.5, ease: "none" }, 0));

      /* glasses reveal bottom-up as the camera reaches them */
      [[1, 0.1], [2, 3.15], [3, 5.95]].forEach(([i, t]) => {
        tl.fromTo("#lg" + i, { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, t);
        tl.fromTo("#lgi" + i, { yPercent: -100 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, t);
        tl.fromTo("#gw" + i, { opacity: 0 }, { opacity: 1, duration: 0.8 }, t + 0.2);
      });

      const up = (sel, t) => tl.fromTo(sel + " .ln", { yPercent: 115 }, { yPercent: 0, duration: 0.55, stagger: 0.08, ease: "expo.out" }, t);
      const out = (sel, t) => tl.to(sel + " .ln", { yPercent: -115, duration: 0.3, stagger: 0.04, ease: "power3.in" }, t);
      const foot = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t);
      const footOut = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.25 }, t);
      const setDown = (p, sh, t) => {
        tl.fromTo(p, { y: -520, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.in" }, t);
        tl.fromTo(sh, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.in" }, t);
        tl.to(p, { scaleY: 0.96, duration: 0.06, transformOrigin: "50% 100%" }, t + 0.4);
        tl.to(p, { scaleY: 1, duration: 0.25, ease: "power2.out", transformOrigin: "50% 100%" }, t + 0.46);
      };

      /* BEAT A — hook */
      up("#hA", 0.15);
      tl.fromTo("#pz", { y: -1300, rotation: -60 }, { y: 0, rotation: 0, duration: 0.42, ease: "power2.in" }, 1.2);
      tl.fromTo("#pz-sh", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "power2.in" }, 1.2);
      tl.to("#pz", { scaleY: 0.8, scaleX: 1.1, duration: 0.06, transformOrigin: "50% 100%" }, 1.62);
      tl.to("#pz", { scaleY: 1, scaleX: 1, duration: 0.3, ease: "power2.out", transformOrigin: "50% 100%" }, 1.68);
      out("#hA", 1.62);
      up("#hA2", 1.78);
      setDown("#pb", "#pb-sh", 1.85);
      foot("#fA", 2.2);
      out("#hA2", 2.85); footOut("#fA", 2.85);

      /* BEAT B */
      up("#hB", 3.5); setDown("#pw", "#pw-sh", 3.5); foot("#fB", 4.0);
      out("#hB", 5.65); footOut("#fB", 5.65);

      /* BEAT C */
      up("#hC", 6.3); setDown("#pr", "#pr-sh", 6.3); foot("#fC", 6.8);

      /* exit into the slate */
      out("#hC", 8.9); footOut("#fC", 8.9);
      tl.to("#stage", { opacity: 0, scale: 0.96, duration: 0.45, ease: "power3.in" }, 9.05);

      /* END SLATE (9.5) */
      tl.fromTo("#sl-stage", { scale: 1.0 }, { scale: 1.03, duration: 3.0, ease: "none" }, 9.5);
      tl.fromTo("#sl-logo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 9.55);
      tl.fromTo("#sl-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 9.9);
      [["#sp-w", "#ss1", 9.85], ["#sp-b", "#ss2", 9.97], ["#sp-r", "#ss3", 10.09]].forEach(([p, s, t]) => {
        tl.fromTo(p, { y: 520 }, { y: 0, duration: 0.6, ease: "power3.out" }, t);
        tl.fromTo(s, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, t + 0.25);
      });
      tl.fromTo("#sl-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.5);
      tl.fromTo("#sl-handle", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 10.75);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
