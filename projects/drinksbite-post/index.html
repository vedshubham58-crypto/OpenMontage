<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=2700" />
    <title>DrinksBite — Range Poster</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geometr706 BlkCn"; src: url("assets/geometr.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Bernard MT Condensed"; src: url("assets/bernard.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Berlin Sans FB"; src: url("assets/berlin.ttf") format("truetype"); font-display: block; }
      html, body { margin: 0; padding: 0; background: #121212; }
      #root { position: relative; width: 2160px; height: 2700px; overflow: hidden; }
      /* design at 1080×1350, rendered at 2× */
      #art { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform: scale(2); transform-origin: 0 0; overflow: hidden;
        background: radial-gradient(ellipse 80% 55% at 50% 62%, #1d1c1b 0%, #141414 55%, #0e0e0e 100%); color: #f5f0ea; text-transform: uppercase; }
      .abs { position: absolute; }
      .pat { position: absolute; inset: -60px; background-image: url("assets/pattern.png"); background-size: 300px 155px; opacity: 0.09; }
      .spot { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 30% at 50% 0%, rgba(245,240,234,0.09) 0%, rgba(245,240,234,0) 70%); }
      .frame { position: absolute; left: 30px; top: 30px; right: 30px; bottom: 30px; border: 1px solid rgba(245,240,234,0.16); }
      .tick { position: absolute; width: 18px; height: 18px; border-color: rgba(245,240,234,0.55); border-style: solid; }
      .lbl { font-family: "Berlin Sans FB", sans-serif; }
      .eyebrow { left: 0; right: 0; text-align: center; font-family: "Berlin Sans FB", sans-serif; letter-spacing: 12px; }
      .head { left: 0; right: 0; text-align: center; font-family: "Geometr706 BlkCn", sans-serif; line-height: 0.95; }
      .tri { display: flex; gap: 5px; }
      .tri span { flex: 1; height: 3px; }
      .glow { position: absolute; border-radius: 50%; }
      .glass { position: absolute; opacity: 0.32; }
      .pk { position: absolute; height: auto; filter: drop-shadow(0 18px 22px rgba(0,0,0,0.55)); }
      .refl { position: absolute; top: 1002px; height: 120px; overflow: hidden;
        -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0) 85%); mask-image: linear-gradient(180deg, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0) 85%); }
      .refl img { position: absolute; left: 0; top: 0; width: 100%; height: auto; transform: scaleY(-1); }
      .col { position: absolute; top: 1040px; width: 330px; text-align: center; }
      .col b { display: block; font-family: "Bernard MT Condensed", serif; font-weight: normal; font-size: 46px; line-height: 0.98; letter-spacing: 0.5px; }
      .col i { display: block; font-style: normal; font-family: "Berlin Sans FB", sans-serif; font-size: 15px; letter-spacing: 7px; color: rgba(245,240,234,0.62); margin-top: 14px; }
      .col em { display: block; font-style: normal; width: 34px; height: 3px; margin: 0 auto 16px; }
      .vr { position: absolute; top: 1048px; width: 1px; height: 120px; background: linear-gradient(180deg, rgba(245,240,234,0) 0%, rgba(245,240,234,0.22) 50%, rgba(245,240,234,0) 100%); }
      .grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); background-size: 256px 256px; opacity: 0.055; mix-blend-mode: overlay; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="2160" data-height="2700" data-duration="1" data-fps="30">
      <section id="p" class="abs" style="inset: 0" data-start="0" data-duration="1" data-track-index="1">
        <div id="art">
          <div class="pat"></div><div class="spot"></div>

          <!-- header strip -->
          <img class="abs" src="assets/logo-h.png" alt="DrinksBite" style="left: 50%; top: 68px; width: 250px; margin-left: -120px" />
          <div class="abs lbl" style="left: 64px; top: 92px; font-size: 13px; letter-spacing: 5px; color: rgba(245,240,234,0.55)">Jowar puffs</div>
          <div class="abs lbl" style="right: 64px; top: 92px; font-size: 13px; letter-spacing: 5px; color: rgba(245,240,234,0.55)">Three flavours</div>
          <div class="abs" style="left: 64px; right: 64px; top: 172px; height: 1px; background: rgba(245,240,234,0.14)"></div>

          <!-- headline -->
          <div class="abs eyebrow" style="top: 214px; font-size: 24px; letter-spacing: 16px">India's first</div>
          <div class="abs head" style="top: 254px; font-size: 128px">Drink-pairing</div>
          <div class="abs head" style="top: 374px; font-size: 128px">Chakna</div>
          <div class="abs tri" style="left: 465px; top: 512px; width: 150px"><span style="background: #f7b733"></span><span style="background: #8a5baa"></span><span style="background: #669933"></span></div>

          <!-- stage: glows, brand line-art glasses, packs, counter, reflections -->
          <div class="glow" style="left: 30px;  top: 560px; width: 360px; height: 520px; background: radial-gradient(ellipse at 50% 55%, rgba(247,183,51,0.26) 0%, rgba(0,0,0,0) 65%)"></div>
          <div class="glow" style="left: 360px; top: 560px; width: 360px; height: 520px; background: radial-gradient(ellipse at 50% 55%, rgba(138,91,170,0.36) 0%, rgba(0,0,0,0) 65%)"></div>
          <div class="glow" style="left: 690px; top: 560px; width: 360px; height: 520px; background: radial-gradient(ellipse at 50% 55%, rgba(102,153,51,0.34) 0%, rgba(0,0,0,0) 65%)"></div>
          <img class="glass" src="assets/la-glass-beer.png"    alt="" style="left: 236px; top: 560px; width: 132px; height: 258px" />
          <img class="glass" src="assets/la-glass-whiskey.png" alt="" style="left: 578px; top: 676px; width: 128px; height: 147px" />
          <img class="glass" src="assets/la-glass-rum.png"     alt="" style="left: 902px; top: 640px; width: 136px; height: 178px" />

          <div class="abs" style="left: 60px; right: 60px; top: 1000px; height: 2px; background: linear-gradient(90deg, rgba(245,240,234,0) 0%, rgba(245,240,234,0.38) 15%, rgba(245,240,234,0.38) 85%, rgba(245,240,234,0) 100%)"></div>
          <div class="abs" style="left: 0; right: 0; top: 1001px; height: 349px; background: linear-gradient(180deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0) 40%)"></div>

          <div class="refl" style="left: 65px;  width: 290px"><img src="assets/pack-beer.png" alt="" /></div>
          <div class="refl" style="left: 395px; width: 290px"><img src="assets/pack-whiskey.png" alt="" /></div>
          <div class="refl" style="left: 725px; width: 290px"><img src="assets/pack-rum.png" alt="" /></div>
          <img class="pk" src="assets/pack-beer.png"    alt="" style="left: 65px;  top: 584px; width: 290px" />
          <img class="pk" src="assets/pack-whiskey.png" alt="" style="left: 395px; top: 589px; width: 290px" />
          <img class="pk" src="assets/pack-rum.png"     alt="" style="left: 725px; top: 600px; width: 290px" />

          <!-- flavour names -->
          <div class="col" style="left: 45px"><em style="background: #f7b733"></em><b style="color: #f7b733">Cheddar<br />&amp; Herbs</b><i>For beer</i></div>
          <div class="vr" style="left: 375px"></div>
          <div class="col" style="left: 375px"><em style="background: #8a5baa"></em><b style="color: #b48fd0">Toasted Sesame<br />Umami</b><i>For whiskey</i></div>
          <div class="vr" style="left: 705px"></div>
          <div class="col" style="left: 705px"><em style="background: #669933"></em><b style="color: #8cc152">Coconut<br />&amp; Spices</b><i>For rum</i></div>

          <!-- footer -->
          <div class="abs" style="left: 64px; right: 64px; top: 1222px; height: 1px; background: rgba(245,240,234,0.14)"></div>
          <div class="abs lbl" style="left: 64px; top: 1250px; font-size: 13px; letter-spacing: 3px; color: rgba(245,240,234,0.55); text-transform: none">@drinksbite_official</div>
          <div class="abs eyebrow" style="top: 1246px; font-size: 20px; letter-spacing: 10px">Pair <span style="color: #f7b733">·</span> Sip <span style="color: #b48fd0">·</span> Repeat</div>
          <div class="abs lbl" style="right: 64px; top: 1250px; font-size: 13px; letter-spacing: 3px; color: rgba(245,240,234,0.55)">drinksbite.com</div>
          <div class="abs eyebrow" style="top: 1286px; font-size: 11px; letter-spacing: 6px; color: rgba(245,240,234,0.4)">Not fried · Not baked · It's popped · Made with jowar</div>

          <div class="frame"></div>
          <div class="tick" style="left: 22px; top: 22px; border-width: 2px 0 0 2px"></div>
          <div class="tick" style="right: 22px; top: 22px; border-width: 2px 2px 0 0"></div>
          <div class="tick" style="left: 22px; bottom: 22px; border-width: 0 0 2px 2px"></div>
          <div class="tick" style="right: 22px; bottom: 22px; border-width: 0 2px 2px 0"></div>
          <div class="vig"></div><div class="grain"></div>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
